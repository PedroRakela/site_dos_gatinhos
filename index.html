<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos Interativos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Galeria dos gatinhos fofos</h1>
    </header>

    <div class="grid">
        <div class="card h-zoom">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400" alt="Gato">
            <div class="info"><h3>Zoom & Cor</h3></div>
        </div>

        <div class="card h-slide">
            <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=400" alt="Gato">
            <div class="overlay"><h3>Saiba Mais</h3></div>
        </div>

        <div class="card h-rotate">
            <img src="https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=400" alt="Gato">
            <div class="info"><h3>Giro Suave</h3></div>
        </div>

        <div class="card h-glow">
            <img src="http://googleusercontent.com/image_collection/image_retrieval/8502260333263916284_3" alt="Gato">
            <div class="info"><h3>Brilho</h3></div>
        </div>
    </div>

</body>
</html>
